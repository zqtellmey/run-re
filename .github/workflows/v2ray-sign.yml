name: Freecloud 签到 (pydoll + V2Ray)

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: 安装 Python 依赖
        run: pip install pydoll ddddocr Pillow

      - name: 下载并启动 Xray 代理
        env:
          V2RAY_CONFIG: ${{ secrets.V2RAY_CONFIG }}
        run: |
          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip xray.zip && chmod +x xray
          echo "$V2RAY_CONFIG" > config.json
          ./xray run -c config.json &
          sleep 3
          echo "直连 IP："
          curl -s ifconfig.me
          echo "代理 IP："
          curl -s --socks5 127.0.0.1:10808 ifconfig.me

      - name: 运行脚本 (带录屏)
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 1
          # 启动录屏
          ffmpeg -f x11grab -video_size 1280x720 -i :99 -codec:v libx264 -preset ultrafast -qp 0 output.mp4 &
          FFMPEG_PID=$!
          sleep 2
          # 运行脚本
          python sign_with_pydoll.py
          # 停止录屏
          kill $FFMPEG_PID
          sleep 2

      - name: 上传截图和录屏
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            screenshots/
            output.mp4
