name: Freecloud 签到 (pydoll + V2Ray)

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装系统依赖 (Chromium + ffmpeg + xvfb + 中文字体)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser xvfb ffmpeg curl unzip fonts-noto-cjk

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 下载并启动 Xray 代理
        env:
          V2RAY_CONFIG: ${{ secrets.V2RAY_CONFIG }}
        run: |
          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip xray.zip && chmod +x xray
          echo "$V2RAY_CONFIG" > config.json
          ./xray run -c config.json &
          sleep 5
          echo "直连 IP："
          curl -s --max-time 5 ifconfig.me
          echo ""
          echo "代理 IP："
          curl -s --max-time 5 --socks5 127.0.0.1:10808 ifconfig.me
          echo ""

      - name: 恢复 Cookie 缓存
        id: restore-cookies
        uses: actions/cache@v4
        with:
          path: ./cookies.json
          key: runfreecloud-cookies-main
          restore-keys: |
            runfreecloud-cookies-

      - name: 显示 Cookie 缓存状态
        run: |
          if [ -f cookies.json ]; then
            echo "✅ 已恢复之前的登录 Cookie"
          else
            echo "ℹ️ 没有缓存的 Cookie，将要全新登录"
          fi

      - name: 运行脚本 (带录屏)
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          HEADLESS: "false"
          DISPLAY: ":99"
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 +extension RANDR &
          sleep 1
          ffmpeg -f x11grab -video_size 1280x720 -i :99 \
            -codec:v libx264 -preset ultrafast -crf 30 -t 300 \
            -movflags +faststart /tmp/recording.mp4 &
          RECORD_PID=$!
          sleep 1
          timeout 285 python sign_pydoll_final.py || echo "脚本退出码: $?"
          echo "=== 截图目录内容 ==="
          ls -la ./screenshots/ || echo "截图目录不存在"
          kill $RECORD_PID 2>/dev/null || true
          wait $RECORD_PID 2>/dev/null || true
          pkill Xvfb 2>/dev/null || true

      - name: 缓存 Cookie 到 GitHub Actions
        if: always()
        uses: actions/cache@v4
        with:
          path: ./cookies.json
          key: runfreecloud-cookies-main

      - name: 上传截图和录屏
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            ./screenshots/*.png
            /tmp/recording.mp4
          retention-days: 3
