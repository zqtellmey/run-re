name: Freecloud 签到续期 (Obscura)

on:
  schedule:
    - cron: '30 1 * * *'   # UTC 1:30 = 北京时间 9:30
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 下载并解压 Obscura
        run: |
          curl -sL -o obscura.tar.gz https://github.com/h4ckf0r0day/obscura/releases/latest/download/obscura-x86_64-linux.tar.gz
          tar xzf obscura.tar.gz
          chmod +x obscura
          echo "✅ Obscura 已就绪"

      - name: 启动 Obscura 并执行签到
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          # 启动 Obscura，隐身模式，监听 9222 端口
          ./obscura serve --port 9222 --stealth &
          OBS_PID=$!
          echo "Obscura PID: $OBS_PID"
          
          # 等待端口就绪
          for i in {1..10}; do
            if ss -tlnp | grep -q 9222; then
              echo "✅ Obscura 已启动"
              break
            fi
            echo "等待 Obscura 启动... ($i/10)"
            sleep 1
          done
          
          # 运行签到脚本（现在用 Playwright）
          python sign_with_obscura_playwright.py
          
          kill $OBS_PID 2>/dev/null || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
